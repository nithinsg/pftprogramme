<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!--FONTS-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* NOTE: no `overflow: hidden` here. Headless Chrome's --window-size includes
     window chrome, so the viewport is shorter than the canvas; overflow:hidden
     would clip the page at the viewport line while --screenshot still captures
     the full 630px, silently cropping the footer. */
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    font-feature-settings: 'cv02','cv03','cv04','ss01';
    background-color: #0A1A2F;
    background-image:
      radial-gradient(ellipse 80% 70% at 12% -10%, rgba(42,90,138,0.42), transparent 62%),
      radial-gradient(ellipse 55% 55% at 92% 25%, rgba(196,118,47,0.20), transparent 66%),
      radial-gradient(ellipse 100% 80% at 50% 115%, rgba(5,14,28,0.9), transparent 70%);
    color: #fff;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 72px 72px;
    -webkit-mask-image: radial-gradient(ellipse 78% 70% at 45% 40%, #000 28%, transparent 76%);
  }
  /* Three explicit bands rather than auto margins — a 1200×630 canvas has no
     room for a layout that can overflow, and this one cannot. */
  .wrap { position: absolute; inset: 0; padding: 62px 72px; display: flex;
          flex-direction: column; justify-content: space-between; }
  .rule { display: inline-block; width: 40px; height: 2px; background: #D9924B; margin-right: 16px; }
  .kicker {
    font-size: 15px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase;
    color: #E7B384; display: flex; align-items: center;
  }
  .brand { font-size: 17px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: #fff; margin-bottom: 12px; }
  h1 {
    font-size: 70px; font-weight: 600; letter-spacing: -0.035em; line-height: 1.02;
    max-width: 800px;
  }
  .tagline { font-size: 24px; font-weight: 500; color: #F1D4B8; margin-top: 20px; letter-spacing: -0.01em; }
  .foot { padding-top: 28px; display: flex; align-items: center; gap: 16px; border-top: 1px solid rgba(255,255,255,0.14); }
  .chip {
    border: 1px solid rgba(255,255,255,0.28); border-radius: 999px; padding: 10px 20px;
    font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #fff;
  }
  .dept { font-size: 14px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.5); }
  /* LOGO SLOT — replace this monogram with the official Yashoda mark. */
  .mono { position: absolute; right: 72px; top: 62px; width: 84px; height: 84px; border: 1px solid rgba(255,255,255,0.22);
          border-radius: 12px; display: flex; align-items: center; justify-content: center;
          font-size: 24px; font-weight: 600; letter-spacing: -0.01em; color: rgba(255,255,255,0.85); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div>
      <div class="brand">Yashoda Hospitals</div>
      <div class="kicker"><span class="rule"></span>Somajiguda &nbsp;|&nbsp; Pulmonology</div>
    </div>

    <div>
      <h1>Pulmo Mentor BFD Workshop</h1>
      <div class="tagline">Knowledge. Expertise. Advanced Pulmonary Care.</div>
    </div>

    <div class="foot">
      <span class="chip">Recorded Sessions</span>
      <span class="dept">Department of Pulmonology</span>
    </div>
  </div>
  <div class="mono">YH</div>
</body>
</html>
